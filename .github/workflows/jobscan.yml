name: jobscan

on:
  schedule:
    # GitHub's scheduler is best-effort and has run this 7h late, so don't rely
    # on any single firing.  Try hourly across the window 21:00 ET -> 08:00 ET;
    # the gate below lets exactly ONE of them through per 9pm slot, so the mail
    # goes out on the first attempt GitHub actually honours.
    - cron: '0 1-12 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to scan (1 = majors only, 2 = others, blank = both)'
        required: false
        default: '1'
      hours:
        description: 'Posting window in hours'
        required: false
        default: '72'
      dry_run:
        description: 'Render the email but do not send it (1 = dry run)'
        required: false
        default: '0'

permissions:
  contents: write          # needed to commit seen.json back to the repo

concurrency:
  group: jobscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # One send per 9pm-ET slot, however late GitHub gets around to running us.
      # The slot is the date of the most recent 21:00 ET that has passed; once a
      # run completes for that slot it is recorded in .last_sent and the
      # remaining hourly attempts exit in seconds.
      - name: Should this run send?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run -- proceeding"
            echo "slot=manual" >> "$GITHUB_OUTPUT"; exit 0
          fi
          h=$(TZ=America/New_York date +%H)
          if [ "$h" -ge 21 ]; then slot=$(TZ=America/New_York date +%F)
          else slot=$(TZ=America/New_York date -d 'yesterday' +%F); fi
          done_slot=$(cat .last_sent 2>/dev/null || echo none)
          echo "ny=$(TZ=America/New_York date '+%F %H:%M')  slot=$slot  last_sent=$done_slot"
          if [ "$slot" = "$done_slot" ]; then
            echo "already sent for this slot -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.11'   # Playwright needs >=3.8
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.skip != 'true'

      # Chromium is only needed for the browser-backed boards (Meta).  Those
      # fail soft, so keep going even if this step has a bad day.
      - name: Install Playwright + Chromium
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      - name: Verify headless Chromium
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True,
                                    args=['--no-sandbox','--disable-dev-shm-usage'])
              pg = b.new_page(); pg.goto('https://example.com', timeout=30000)
              print('headless chromium OK:', pg.title())
              b.close()
          PY

      # scan_all.py runs the browser boards in a subprocess using the
      # interpreter it is itself running under (3.11 here).
      # Resumes are PII and this repo is public, so they are kept in a secret
      # (base64 of a JSON {tag: text} map) and written to resumes/ at runtime.
      - name: Materialise resumes
        if: steps.gate.outputs.skip != 'true'
        env:
          RESUMES_B64: ${{ secrets.RESUMES_B64 }}
        run: |
          if [ -z "$RESUMES_B64" ]; then
            echo "RESUMES_B64 not set -- scan will run without resume advice"
            exit 0
          fi
          python - <<'PY'
          import base64,gzip,json,os
          os.makedirs('resumes',exist_ok=True)
          raw=gzip.decompress(base64.b64decode(os.environ['RESUMES_B64']))
          for tag,txt in json.loads(raw).items():
              open('resumes/%s.txt'%tag,'w').write(txt)
              print('wrote resumes/%s.txt (%d chars)'%(tag,len(txt)))
          PY

      - name: Run scan
        if: steps.gate.outputs.skip != 'true'
        run: |
          python scan_all.py \
            "${{ github.event.inputs.tier || '1' }}" \
            "${{ github.event.inputs.hours || '72' }}" \
            | tee scan_output.txt

      - name: Email new roles
        if: steps.gate.outputs.skip != 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python notify.py

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: jobscan-results
          path: |
            scan_output.txt
            passed.json

      - name: Persist state
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.dry_run != '1'
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          echo "${{ steps.gate.outputs.slot }}" > .last_sent
          git add -- seen.json .last_sent || true
          git diff --cached --quiet && exit 0
          git commit -m "state $(date -u +%F)"
          git push
