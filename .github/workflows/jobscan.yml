name: jobscan

on:
  schedule:
    # GitHub cron is UTC-only, so both fire every day; the "Skip off-hour
    # schedule" step below drops whichever one isn't 21:00 in New York.
    - cron: '0 1 * * *'   # 21:00 America/New_York while EDT (UTC-4)
    - cron: '0 2 * * *'   # 21:00 America/New_York while EST (UTC-5)
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to scan (1 = majors only, 2 = others, blank = both)'
        required: false
        default: '1'
      hours:
        description: 'Posting window in hours'
        required: false
        default: '72'
      dry_run:
        description: 'Render the email but do not send it (1 = dry run)'
        required: false
        default: '0'

permissions:
  contents: write          # needed to commit seen.json back to the repo

concurrency:
  group: jobscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Both schedules fire daily and only one of them is 21:00 in New York.
      # Decide from WHICH CRON fired, not from the clock: GitHub routinely runs
      # scheduled jobs hours late (we have seen 7h), and a wall-clock check
      # skips both runs when that happens -- which is exactly what it did.
      - name: Skip the off-season schedule
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual run -- proceeding"; exit 0
          fi
          fired='${{ github.event.schedule }}'
          # -0400 while EDT, -0500 while EST
          off=$(TZ=America/New_York date +%z)
          case "$off" in
            -0400) want='0 1 * * *' ;;   # 01:00 UTC == 21:00 EDT
            -0500) want='0 2 * * *' ;;   # 02:00 UTC == 21:00 EST
            *)     want="$fired" ;;      # unexpected offset: do not skip
          esac
          echo "fired='$fired'  ny_offset=$off  want='$want'"
          if [ "$fired" != "$want" ]; then
            echo "off-season schedule -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.11'   # Playwright needs >=3.8
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.skip != 'true'

      # Chromium is only needed for the browser-backed boards (Meta).  Those
      # fail soft, so keep going even if this step has a bad day.
      - name: Install Playwright + Chromium
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      - name: Verify headless Chromium
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True,
                                    args=['--no-sandbox','--disable-dev-shm-usage'])
              pg = b.new_page(); pg.goto('https://example.com', timeout=30000)
              print('headless chromium OK:', pg.title())
              b.close()
          PY

      # scan_all.py runs the browser boards in a subprocess using the
      # interpreter it is itself running under (3.11 here).
      # Resumes are PII and this repo is public, so they are kept in a secret
      # (base64 of a JSON {tag: text} map) and written to resumes/ at runtime.
      - name: Materialise resumes
        if: steps.gate.outputs.skip != 'true'
        env:
          RESUMES_B64: ${{ secrets.RESUMES_B64 }}
        run: |
          if [ -z "$RESUMES_B64" ]; then
            echo "RESUMES_B64 not set -- scan will run without resume advice"
            exit 0
          fi
          python - <<'PY'
          import base64,gzip,json,os
          os.makedirs('resumes',exist_ok=True)
          raw=gzip.decompress(base64.b64decode(os.environ['RESUMES_B64']))
          for tag,txt in json.loads(raw).items():
              open('resumes/%s.txt'%tag,'w').write(txt)
              print('wrote resumes/%s.txt (%d chars)'%(tag,len(txt)))
          PY

      - name: Run scan
        if: steps.gate.outputs.skip != 'true'
        run: |
          python scan_all.py \
            "${{ github.event.inputs.tier || '1' }}" \
            "${{ github.event.inputs.hours || '72' }}" \
            | tee scan_output.txt

      - name: Email new roles
        if: steps.gate.outputs.skip != 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python notify.py

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: jobscan-results
          path: |
            scan_output.txt
            passed.json

      - name: Persist state
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.dry_run != '1'
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -- seen.json || true
          git diff --cached --quiet && exit 0
          git commit -m "state $(date -u +%F)"
          git push
